<script>
(function () {

    /* =====================================================
       تشخیص قطعی محیط Elementor
    ===================================================== */

    function isElementor() {

        /* حالت معمول Elementor */
        if (
            window.elementorFrontend ||
            window.elementor ||
            window.elementorCommon
        ) {
            return true;
        }

        /* کلاس‌های Elementor */
        if (
            document.documentElement.classList.contains('elementor-editor-active') ||
            document.documentElement.classList.contains('elementor-editor-preview') ||
            document.body?.classList.contains('elementor-editor-active') ||
            document.body?.classList.contains('elementor-editor-preview')
        ) {
            return true;
        }

        /* iframe ادیتور Elementor */
        if (window.parent && window.parent !== window) {

            try {

                if (
                    window.parent.elementor ||
                    window.parent.elementorFrontend ||
                    window.parent.elementorCommon
                ) {
                    return true;
                }

            } catch (e) {}

        }

        return false;
    }


    /* =====================================================
       اگر داخل Elementor هستیم:
       هیچ قفل اسکرولی اجرا نکن
    ===================================================== */

    if (isElementor()) {

        /* اگر قبلاً به هر دلیلی کلاس اضافه شده بود، حذفش کن */

        document.documentElement.classList.remove('intro-active');

        if (document.body) {
            document.body.classList.remove('intro-active');
        }

        /* اجازه اسکرول کامل به Elementor */

        document.documentElement.style.removeProperty('overflow');
        document.documentElement.style.removeProperty('height');
        document.body?.style.removeProperty('overflow');
        document.body?.style.removeProperty('height');

        return;
    }


    /* =====================================================
       از اینجا به بعد فقط سایت واقعی
    ===================================================== */

    function lockPage() {

        document.documentElement.classList.add('intro-active');

        if (document.body) {
            document.body.classList.add('intro-active');
        }

    }


    function unlockPage() {

        document.documentElement.classList.remove('intro-active');

        if (document.body) {
            document.body.classList.remove('intro-active');
        }

    }


    /* قفل اسکرول */

    if (document.body) {
        lockPage();
    }


    document.addEventListener('DOMContentLoaded', function () {

        lockPage();

        initIntro();

    }, { once: true });


    function initIntro() {

        const introOverlay = document.getElementById('introOverlay');
        const video = document.getElementById('introVideo');
        const clickText = document.getElementById('clickText');
        const musicModal = document.getElementById('musicModal');
        const cardAudio = document.getElementById('cardAudio');

        if (!introOverlay || !video) {
            unlockPage();
            return;
        }


        let isStarted = false;
        let isEnded = false;


        /* =====================================================
           شروع ویدئو
        ===================================================== */

        function handleFirstInteraction(e) {

            if (isStarted || isEnded) return;

            isStarted = true;

            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }


            /* حذف متن راهنما */

            if (clickText) {

                clickText.style.animation = 'none';
                clickText.style.opacity = '0';

                setTimeout(function () {

                    if (
                        clickText &&
                        clickText.parentNode
                    ) {
                        clickText.remove();
                    }

                }, 300);

            }


            /* شروع ویدئو */

            video.muted = false;

            try {
                video.currentTime = 0;
            } catch (err) {}


            const playPromise = video.play();

            if (playPromise !== undefined) {

                playPromise.catch(function (err) {

                    console.log(
                        'خطا در پخش ویدئو:',
                        err
                    );

                });

            }

        }


        /* فقط click */

        introOverlay.addEventListener(
            'click',
            handleFirstInteraction,
            { passive: false }
        );


        /* =====================================================
           پایان اینترو
        ===================================================== */

        function endIntro() {

            if (isEnded) return;

            isEnded = true;


            /* توقف ویدئو */

            try {
                video.pause();
            } catch (err) {}


            /* فید اوت */

            introOverlay.classList.add('fade-out');


            /* آزاد کردن اسکرول */

            unlockPage();


            /* نمایش مودال موزیک */

            setTimeout(function () {

                if (
                    musicModal &&
                    document.body.contains(musicModal)
                ) {

                    musicModal.style.display = 'flex';

                }

            }, 400);


            /* حذف کامل اینترو */

            setTimeout(function () {

                if (
                    introOverlay &&
                    introOverlay.parentNode
                ) {

                    introOverlay.remove();

                }


                /* آزاد کردن reference ویدئو */

                try {

                    video.removeAttribute('src');
                    video.load();

                } catch (err) {}

            }, 850);


            /* حذف listener */

            video.removeEventListener(
                'ended',
                endIntro
            );

        }


        /* =====================================================
           پایان واقعی ویدئو
        ===================================================== */

        video.addEventListener(
            'ended',
            endIntro,
            { once: true }
        );


        /* =====================================================
           fallback
        ===================================================== */

        video.addEventListener(
            'timeupdate',
            function checkVideoEnd() {

                if (
                    video.duration &&
                    video.currentTime >=
                    video.duration - 0.15
                ) {

                    endIntro();

                    video.removeEventListener(
                        'timeupdate',
                        checkVideoEnd
                    );

                }

            }
        );


        /* =====================================================
           خطای ویدئو
        ===================================================== */

        video.addEventListener(
            'error',
            function () {

                console.log(
                    'خطا در بارگذاری ویدئوی اینترو'
                );

                endIntro();

            },
            { once: true }
        );


        /* =====================================================
           موزیک
        ===================================================== */

        window.playMusic = function (allow) {

            if (!musicModal) return;

            musicModal.style.display = 'none';


            if (
                allow &&
                cardAudio
            ) {

                cardAudio.volume = 0.5;

                const audioPromise =
                    cardAudio.play();

                if (
                    audioPromise !== undefined
                ) {

                    audioPromise.catch(
                        function (err) {

                            console.log(
                                'خطا در پخش موزیک:',
                                err
                            );

                        }
                    );

                }

            }

        };

    }

})();
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // تنظیم تاریخ هدف (قابل ویرایش)
    const targetDate = new Date("2026-09-30T19:00:00").getTime();

    const container = document.getElementById("cardContainer");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            container.innerHTML = "<h2 style='color:white; font-family:var(--font-family); padding:15px; margin:0;'>مهلت به پایان رسید</h2>";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        const pad = (num) => String(num).padStart(2, "0");

        daysEl.textContent = pad(days);
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

});
</script>
